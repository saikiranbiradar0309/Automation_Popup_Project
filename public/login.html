<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to AutomationLab – Selenium & Playwright Practice Platform">
    <title>Login – AutomationLab</title>
    <link rel="stylesheet" href="css/global.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-page {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-logo a {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
            text-decoration: none;
            color: var(--text-primary);
        }

        .auth-logo .logo-icon {
            width: 40px; height: 40px;
            background: var(--grad-primary);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
            box-shadow: 0 4px 15px rgba(59,130,246,0.4);
        }

        .auth-logo .logo-name span {
            background: var(--grad-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-xl);
            backdrop-filter: blur(20px);
            box-shadow: var(--shadow-card);
            padding: 40px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-header h1 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .auth-header p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* Test Credentials Box */
        .creds-box {
            background: rgba(59,130,246,0.06);
            border: 1px dashed rgba(59,130,246,0.3);
            border-radius: var(--radius-md);
            padding: 18px 20px;
            margin-bottom: 28px;
        }

        .creds-box-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
        }

        .creds-box-header span {
            font-size: 13px;
            font-weight: 700;
            color: #93c5fd;
            letter-spacing: 0.5px;
        }

        .creds-table {
            width: 100%;
            border-collapse: collapse;
        }

        .creds-table th {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            text-align: left;
            padding-bottom: 8px;
            padding-right: 16px;
            font-weight: 600;
        }

        .creds-table td {
            padding: 5px 0;
            padding-right: 16px;
        }

        .creds-table .cred-val {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--text-code);
            background: rgba(125,211,252,0.06);
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: var(--transition);
        }

        .creds-table .cred-val:hover {
            border-color: rgba(125,211,252,0.3);
            background: rgba(125,211,252,0.12);
        }

        .fill-btn {
            font-size: 11px;
            padding: 3px 8px;
            background: rgba(59,130,246,0.15);
            border: 1px solid rgba(59,130,246,0.3);
            border-radius: 4px;
            color: #93c5fd;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
        }

        .fill-btn:hover {
            background: rgba(59,130,246,0.25);
        }

        /* Password wrapper */
        .pw-wrap {
            position: relative;
        }

        .pw-wrap input { padding-right: 45px; }

        .pw-toggle {
            position: absolute;
            right: 12px; top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 18px;
            transition: var(--transition);
        }

        .pw-toggle:hover { color: var(--text-primary); }

        /* Error message */
        .auth-error {
            background: rgba(244,63,94,0.1);
            border: 1px solid rgba(244,63,94,0.3);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            color: #fda4af;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .auth-error.visible { display: flex; }

        .auth-footer-link {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .auth-footer-link a {
            color: var(--accent-blue);
            font-weight: 600;
        }

        .auth-footer-link a:hover {
            text-decoration: underline;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            color: var(--text-muted);
            font-size: 12px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-subtle);
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .back-home:hover { color: var(--text-secondary); }
    </style>
</head>

<body>

    <!-- Background Orbs -->
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>

    <div class="auth-page">

        <!-- Logo -->
        <div class="auth-logo">
            <a href="/">
                <div class="logo-icon">🤖</div>
                <div class="logo-name"><span>Automation</span>Lab</div>
            </a>
        </div>

        <!-- Card -->
        <div class="auth-card">

            <div class="auth-header">
                <h1>Welcome Back 👋</h1>
                <p>Login to access your practice dashboard</p>
            </div>


            <!-- ── TEST CREDENTIALS ── -->

            <div class="creds-box" id="credsBox">
                <div class="creds-box-header">
                    <span>🧪</span>
                    <span>Test Credentials — Click to auto-fill</span>
                </div>
                <table class="creds-table">
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Password</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td><code class="cred-val" onclick="fillCreds('testuser','Test@1234')">testuser</code></td>
                            <td><code class="cred-val" onclick="fillCreds('testuser','Test@1234')">Test@1234</code></td>
                            <td><button class="fill-btn" onclick="fillCreds('testuser','Test@1234')">Fill</button></td>
                        </tr>
                        <tr>
                            <td><code class="cred-val" onclick="fillCreds('admin','Admin@123')">admin</code></td>
                            <td><code class="cred-val" onclick="fillCreds('admin','Admin@123')">Admin@123</code></td>
                            <td><button class="fill-btn" onclick="fillCreds('admin','Admin@123')">Fill</button></td>
                        </tr>
                        <tr>
                            <td><code class="cred-val" onclick="fillCreds('practice','Practice@99')">practice</code></td>
                            <td><code class="cred-val" onclick="fillCreds('practice','Practice@99')">Practice@99</code></td>
                            <td><button class="fill-btn" onclick="fillCreds('practice','Practice@99')">Fill</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>


            <!-- ── ERROR MESSAGE ── -->

            <div class="auth-error" id="loginError">
                <span>⚠️</span>
                <span id="loginErrorMsg">Invalid credentials.</span>
            </div>


            <!-- ── LOGIN FORM ── -->

            <form id="loginForm" autocomplete="off" novalidate>

                <div class="form-group">
                    <label class="form-label" for="loginUsername">Username or Email</label>
                    <input
                        type="text"
                        id="loginUsername"
                        name="username"
                        class="form-control"
                        placeholder="Enter username or email"
                        autocomplete="username"
                        data-testid="login-username"
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="loginPassword">Password</label>
                    <div class="pw-wrap">
                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            class="form-control"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            data-testid="login-password"
                        >
                        <button type="button" class="pw-toggle" id="pwToggle" aria-label="Toggle password visibility">👁</button>
                    </div>
                </div>

                <button
                    type="submit"
                    class="btn btn-primary btn-full btn-lg"
                    id="loginBtn"
                    data-testid="login-submit"
                    style="margin-top:8px;"
                >
                    🔓 Login to Dashboard
                </button>

            </form>

            <div class="divider">or</div>

            <a href="/signup" class="btn btn-outline btn-full" data-testid="goto-signup">
                ✨ Create New Account
            </a>

            <div class="auth-footer-link">
                Don't have an account?
                <a href="/signup">Sign up free</a>
            </div>

        </div>

        <a href="/" class="back-home">← Back to Home</a>

    </div>


    <!-- Toast -->
    <div id="toast-container"></div>

    <script src="js/toast.js"></script>
    <script>
        // ── Auto-fill credentials
        function fillCreds(user, pass) {
            document.getElementById('loginUsername').value = user;
            document.getElementById('loginPassword').value = pass;
            document.getElementById('loginUsername').dispatchEvent(new Event('input'));
            document.getElementById('loginPassword').dispatchEvent(new Event('input'));
            showToast('Credentials filled! Click Login.', 'info');
        }

        // ── Toggle password visibility
        document.getElementById('pwToggle').addEventListener('click', () => {
            const inp = document.getElementById('loginPassword');
            const btn = document.getElementById('pwToggle');
            if (inp.type === 'password') {
                inp.type = 'text';
                btn.textContent = '🙈';
            } else {
                inp.type = 'password';
                btn.textContent = '👁';
            }
        });

        // ── Login form submit
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const btn      = document.getElementById('loginBtn');
            const errBox   = document.getElementById('loginError');
            const errMsg   = document.getElementById('loginErrorMsg');

            if (!username || !password) {
                errMsg.textContent = 'Please enter username and password.';
                errBox.classList.add('visible');
                return;
            }

            btn.disabled = true;
            btn.textContent = '⏳ Logging in...';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (data.success) {
                    errBox.classList.remove('visible');
                    showToast('Login successful! Redirecting…', 'success');

                    // Check for redirect param
                    const params = new URLSearchParams(window.location.search);
                    const mod = params.get('module');
                    setTimeout(() => {
                        window.location.href = '/dashboard' + (mod ? '?module=' + mod : '');
                    }, 800);
                } else {
                    errMsg.textContent = data.message || 'Invalid credentials.';
                    errBox.classList.add('visible');
                    btn.disabled = false;
                    btn.textContent = '🔓 Login to Dashboard';
                }
            } catch (err) {
                errMsg.textContent = 'Server error. Please try again.';
                errBox.classList.add('visible');
                btn.disabled = false;
                btn.textContent = '🔓 Login to Dashboard';
            }
        });

        // Redirect if already logged in
        fetch('/api/me').then(r => r.json()).then(d => {
            if (d.success) window.location.href = '/dashboard';
        });
    </script>
</body>
</html>
